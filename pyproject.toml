[project]
name = "image-calculator"
version = "0.1.0"
description = "手書き数式を物体検出で読み取る画像計算機"
requires-python = "==3.10"
dependencies = [
    "matplotlib==3.10.9",
    "pillow==12.2.0",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "tqdm==4.67.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
